<!-- MODALS, DRAWERS & WIDGETS COMPONENT -->

<!-- DRAWER (Fiche Métier) -->
<div class="drawer-overlay" id="job-drawer" role="dialog" aria-modal="true" aria-label="Fiche métier">
  <div class="drawer-sheet">
    <div class="drawer-header">
      <span class="drawer-title">DOCUMENT OFFICIEL — FICHE MÉTIER</span>
      <button class="drawer-close" id="drawer-close" aria-label="Fermer">✕</button>
    </div>
    <div class="drawer-body" id="drawer-content"></div>
  </div>
</div>

<!-- COMPARE MODAL -->
<div class="modal-overlay" id="compare-modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title-wrap">
        <span class="modal-head-icon">⚖️</span>
        <span data-i18n="compare_modal_title">Comparateur de Métiers</span>
      </div>
      <button class="modal-close" id="btn-close-compare-modal" aria-label="Fermer">✕</button>
    </div>
    <div class="modal-body" id="comparison-content"></div>
  </div>
</div>

<!-- FLOATING COMPARE BAR -->
<div class="compare-bar" id="compare-bar" style="display:none">
  <span id="compare-bar-count">0 métier(s)</span>
  <button class="btn-primary" id="btn-view-compare" data-i18n="btn_compare_label">Comparer</button>
  <button class="btn-ghost-sm" id="btn-clear-compare">✕</button>
</div>

<!-- AI CHAT WIDGET -->
<button class="chat-fab" id="chat-widget-trigger" aria-label="Assistant IA">💬</button>
<div class="chat-window" id="chat-widget-window">
  <div class="chat-header">
    <span>Assistant IA RTMC</span>
    <button id="chat-widget-close">✕</button>
  </div>
  <div class="chat-messages" id="chat-widget-messages">
    <div class="chat-msg assistant">
      <div class="chat-bubble">Bonjour ! Posez-moi une question sur les métiers ou les compétences.</div>
    </div>
  </div>
  <form class="chat-input-row" id="chat-widget-form">
    <input type="text" id="chat-widget-input" placeholder="Votre question…" autocomplete="off">
    <button type="submit">↑</button>
  </form>
</div>
