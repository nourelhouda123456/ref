<!-- HERO & SEARCH COMPONENT -->
<section class="hero-band" id="explore-zone">
  <div class="hero-content">
    <div class="hero-badge">
      <span class="badge-dot"></span>
      <span data-i18n="hero_badge">🇹🇳 RTMC (Tunisie) &amp; 🇪🇺 ESCO (Europe) · Référentiel Commun</span>
    </div>
    <h1 data-i18n="hero_title">Découvrez le métier qui vous correspond</h1>
    <p data-i18n="hero_subtitle">Explorez les métiers, les compétences et les passerelles des référentiels RTMC (Tunisie 🇹🇳) et ESCO (Europe 🇪🇺).</p>

    <!-- REFERENTIAL SOURCE FILTER TABS -->
    <div class="hero-source-filter">
      <div class="source-filter-tabs" id="source-filter-tabs">
        <button class="source-tab active" data-source="all">🌐 Tous <span class="tab-count" id="count-all">3 468</span></button>
        <button class="source-tab" data-source="rtmc">🇹🇳 RTMC <span class="tab-count" id="count-rtmc">530</span></button>
        <button class="source-tab" data-source="esco">🇪🇺 ESCO <span class="tab-count" id="count-esco">2 938</span></button>
      </div>
    </div>

    <!-- SEARCH BAR UNIFIED (Filter + Search) -->
    <div class="search-wrap unified-search-wrap" id="search-wrap">
      <form class="search-bar unified-search-bar" id="hero-search-form" autocomplete="off">
        
        <!-- Custom Inline Domain Dropdown -->
        <div class="inline-domain-wrap" id="custom-domain-wrap">
          <div class="custom-domain-trigger" id="custom-domain-trigger">
            <span class="trigger-text" id="custom-domain-text">Tous les domaines</span>
            <span class="caret"></span>
          </div>
          <div class="custom-domain-menu suggestions-box" id="custom-domain-menu">
            <!-- Options rendered via JS -->
          </div>
        </div>

        <div class="search-divider"></div>

        <span class="search-icon">🔍</span>
        <input type="text" id="hero-search-input" data-i18n-placeholder="search_placeholder" placeholder="Rechercher un métier, une compétence…">
        <button type="submit" id="btn-search" data-i18n="btn_search">Rechercher</button>
      </form>
      <div class="suggestions-box" id="search-suggestions"></div>
    </div>

    <!-- RESULTS INFO BAR -->
    <div class="results-bar" id="results-bar">
      <span class="results-count" id="results-count">3 468 métiers disponibles</span>
      <button class="btn-clear-filters" id="btn-clear-filters" style="display:none" data-i18n="btn_clear">✕ Effacer les filtres</button>
    </div>
  </div>
</section>
